[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sincnn3"
version = "0.1.0"
description = "波（sin・cos）と光の器で、覚える・引く・推し量るためのライブラリ（Sin-CNN3 の研究の部品）"
readme = "docs/library.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["sincnn3"]
