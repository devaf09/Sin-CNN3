<svg viewBox='0 0 950 500' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}
.arr{stroke:#666;stroke-width:1.4} .ax{stroke:#999;stroke-width:1}</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker></defs><rect width='950' height='500' fill='#fff'/><text class='th' x='470' y='22' text-anchor='middle'>1 段目: 骨格（抽象的なスロット）→ 2 段目: スロットごとに並列で文節へ展開</text><rect x='30' y='40' width='200' height='58' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='130.0' y='59' text-anchor='middle'>nsubj ・ 太郎</text><text class='ts' x='130.0' y='76' text-anchor='middle'>名詞</text><path class='arr' d='M130 100 L130 140' marker-end='url(#a)'/><rect x='30' y='144' width='200' height='40' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='t' x='130.0' y='163' text-anchor='middle'>太郎は</text><rect x='260' y='40' width='200' height='58' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='360.0' y='59' text-anchor='middle'>obl ・ 浜辺</text><text class='ts' x='360.0' y='76' text-anchor='middle'>名詞</text><path class='arr' d='M360 100 L360 140' marker-end='url(#a)'/><rect x='260' y='144' width='200' height='40' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='t' x='360.0' y='163' text-anchor='middle'>浜辺で</text><rect x='490' y='40' width='200' height='58' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='590.0' y='59' text-anchor='middle'>obj ・ 亀</text><text class='ts' x='590.0' y='76' text-anchor='middle'>名詞</text><path class='arr' d='M590 100 L590 140' marker-end='url(#a)'/><rect x='490' y='144' width='200' height='40' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='t' x='590.0' y='163' text-anchor='middle'>亀を</text><rect x='720' y='40' width='200' height='58' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='820.0' y='59' text-anchor='middle'>ROOT ・ 見付ける</text><text class='ts' x='820.0' y='76' text-anchor='middle'>動詞・丁寧</text><path class='arr' d='M820 100 L820 140' marker-end='url(#a)'/><rect x='720' y='144' width='200' height='40' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='t' x='820.0' y='163' text-anchor='middle'>見つけます。</text><rect x='30' y='112' width='890' height='18' fill='#FBEFD5' opacity='0.8'/><text class='ts' x='475' y='125' text-anchor='middle'>参照光: 係る先の述語の語（見付ける）を全スロットへ配る  ／  格まで骨格が決める版: nsubj:は・obl:で・obj:を</text><text class='th' x='470' y='218' text-anchor='middle'>役割ごとの文節の正答（試しの文節 2.2 万、1 語ずつの展開）</text><line class='ax' x1='70' y1='400' x2='900' y2='400'/><line x1='70' x2='900' y1='400' y2='400' stroke='#eee'/><text class='ts' x='64' y='404' text-anchor='end'>0%</text><line x1='70' x2='900' y1='315.0' y2='315.0' stroke='#eee'/><text class='ts' x='64' y='319.0' text-anchor='end'>50%</text><line x1='70' x2='900' y1='230' y2='230' stroke='#eee'/><text class='ts' x='64' y='234' text-anchor='end'>100%</text><rect x='84' y='238.84' width='24' height='161.16' fill='#B8C7D9' rx='2'/><rect x='111' y='238.84' width='24' height='161.16' fill='#3B7DD8' rx='2'/><rect x='138' y='238.67000000000002' width='24' height='161.32999999999998' fill='#D85A30' rx='2'/><text class='ts' x='124' y='416' text-anchor='middle'>obj</text><rect x='187' y='274.37' width='24' height='125.63' fill='#B8C7D9' rx='2'/><rect x='214' y='274.03' width='24' height='125.97' fill='#3B7DD8' rx='2'/><rect x='241' y='259.07' width='24' height='140.93' fill='#D85A30' rx='2'/><text class='ts' x='227' y='416' text-anchor='middle'>nmod</text><rect x='290' y='275.9' width='24' height='124.1' fill='#B8C7D9' rx='2'/><rect x='317' y='273.86' width='24' height='126.14' fill='#3B7DD8' rx='2'/><rect x='344' y='261.79' width='24' height='138.20999999999998' fill='#D85A30' rx='2'/><text class='ts' x='330' y='416' text-anchor='middle'>advmod</text><rect x='393' y='325.2' width='24' height='74.8' fill='#B8C7D9' rx='2'/><rect x='420' y='314.15' width='24' height='85.85' fill='#3B7DD8' rx='2'/><rect x='447' y='253.97' width='24' height='146.03' fill='#D85A30' rx='2'/><text class='ts' x='433' y='416' text-anchor='middle'>nsubj</text><rect x='496' y='298.51' width='24' height='101.49' fill='#B8C7D9' rx='2'/><rect x='523' y='297.32' width='24' height='102.67999999999999' fill='#3B7DD8' rx='2'/><rect x='550' y='297.15' width='24' height='102.85' fill='#D85A30' rx='2'/><text class='ts' x='536' y='416' text-anchor='middle'>acl</text><rect x='599' y='348.49' width='24' height='51.51' fill='#B8C7D9' rx='2'/><rect x='626' y='342.37' width='24' height='57.63' fill='#3B7DD8' rx='2'/><rect x='653' y='292.73' width='24' height='107.27' fill='#D85A30' rx='2'/><text class='ts' x='639' y='416' text-anchor='middle'>obl</text><rect x='702' y='349.85' width='24' height='50.15' fill='#B8C7D9' rx='2'/><rect x='729' y='347.98' width='24' height='52.019999999999996' fill='#3B7DD8' rx='2'/><rect x='756' y='346.45' width='24' height='53.55' fill='#D85A30' rx='2'/><text class='ts' x='742' y='416' text-anchor='middle'>ROOT</text><rect x='805' y='359.88' width='24' height='40.12' fill='#B8C7D9' rx='2'/><rect x='832' y='355.63' width='24' height='44.370000000000005' fill='#3B7DD8' rx='2'/><rect x='859' y='349.34000000000003' width='24' height='50.66' fill='#D85A30' rx='2'/><text class='ts' x='845' y='416' text-anchor='middle'>advcl</text><rect x='110' y='430' width='14' height='14' fill='#B8C7D9'/><text class='ts' x='130' y='442' text-anchor='start'>役割・品詞・印だけ</text><rect x='360' y='430' width='14' height='14' fill='#3B7DD8'/><text class='ts' x='380' y='442' text-anchor='start'>+ 中身の語 + 参照光</text><rect x='610' y='430' width='14' height='14' fill='#D85A30'/><text class='ts' x='630' y='442' text-anchor='start'>+ 格まで骨格が決める</text><text class='ts' x='470' y='468' text-anchor='middle'>全体: 47% → 49% → 60%（句読点を除いた尾は 52% → 55% → 68%）。決まらないのは 文の結び（ROOT）と つなぎ（advcl）</text></svg>