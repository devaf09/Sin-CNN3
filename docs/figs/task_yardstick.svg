<svg viewBox='0 0 900 380' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222} .arr{stroke:#666;stroke-width:1.4;fill:none}</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker></defs><rect width='900' height='380' fill='#fff'/><text class='th' x='230' y='24' text-anchor='middle'>これまで（実験87〜108）</text><text class='th' x='690' y='24' text-anchor='middle'>これから</text><rect x='30' y='44' width='180' height='50' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='120.0' y='63' text-anchor='middle'>材料（文）</text><text class='ts' x='120.0' y='80' text-anchor='middle'>会話・青空文庫</text><rect x='250' y='44' width='180' height='50' rx='8' fill='#FCE3DA' stroke='#D85A30'/><text class='th' x='340.0' y='63' text-anchor='middle'>人が作った木</text><text class='ts' x='340.0' y='80' text-anchor='middle'>GiNZA（正解として）</text><rect x='140' y='140' width='200' height='54' rx='8' fill='#EEEEEE' stroke='#888'/><text class='th' x='240.0' y='159' text-anchor='middle'>自分で張った木</text><text class='ts' x='240.0' y='176' text-anchor='middle'>「GiNZA と同じか」で測る</text><path class='arr' d='M120 96 L200 138' marker-end='url(#a)'/><path class='arr' d='M340 96 L280 138' marker-end='url(#a)' stroke-dasharray='5 4'/><path class='arr' d='M140 180 C 60 200, 60 230, 150 230 C 230 230, 260 220, 240 196' marker-end='url(#a)'/><text class='ts' x='120' y='252' text-anchor='middle'>自分の木で自分を学び直す → 癖を強め合う（67%）</text><rect x='540' y='44' width='300' height='50' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='690.0' y='63' text-anchor='middle'>材料（文・会話・物語）</text><rect x='500' y='130' width='170' height='64' rx='8' fill='#D8F1EE' stroke='#1F8F84'/><text class='th' x='585.0' y='149' text-anchor='middle'>育つ構造</text><text class='ts' x='585.0' y='166' text-anchor='middle'>木・メッシュ・重ね合わせ</text><text class='ts' x='585.0' y='183' text-anchor='middle'>形は決めない</text><rect x='700' y='130' width='180' height='64' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='th' x='790.0' y='149' text-anchor='middle'>当たるか（外の答え）</text><text class='ts' x='790.0' y='166' text-anchor='middle'>次の語・穴埋め</text><text class='ts' x='790.0' y='183' text-anchor='middle'>質問・話者関係</text><path class='arr' d='M640 96 L590 128' marker-end='url(#a)'/><path class='arr' d='M740 96 L790 128' marker-end='url(#a)'/><path class='arr' d='M672 162 L698 162' marker-end='url(#a)'/><path class='arr' d='M790 196 C 790 250, 590 250, 585 198' marker-end='url(#a)'/><text class='ts' x='690' y='262' text-anchor='middle'>当たるものが増えた構造だけ残す（答えは材料そのもの）</text><rect x='30' y='290' width='850' height='74' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='455.0' y='309' text-anchor='middle'>物差しの一覧（同じ材料・同じ試しの文で、構造だけ取り替えて比べる）</text><text class='ts' x='455.0' y='326' text-anchor='middle'>1. 穴埋め: 文の中の語を隠して当てる（実験109）  2. 次の語・次の文の中身（実験77）  3. 浦島太郎の質問 30 問（実験87〜104）</text><text class='ts' x='455.0' y='343' text-anchor='middle'>4. 話者関係: 誰が誰に話しているか・丁寧さから、文の結びを当てる（言結いの最初の目標、実験105 の ROOT 32%）</text></svg>