</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker></defs><rect width='720' height='400' fill='#fff'/><g class='c-coral'><rect x='230' y='14' width='260' height='62' rx='8'/><text class='th' x='360.0' y='34' text-anchor='middle'>根: 動詞句（述語）</text><text class='t' x='360.0' y='53' text-anchor='middle'>暮らし て い まし た 。</text></g><text class='ts' x='360' y='92' text-anchor='middle'>動詞 暮らす + 助詞 て + 動詞(補) いる + 助動詞 ます + 助動詞 た + 句点</text><g class='c-teal'><rect x='40' y='150' width='200' height='62' rx='8'/><text class='th' x='140.0' y='170' text-anchor='middle'>副詞句（いつ）</text><text class='t' x='140.0' y='189' text-anchor='middle'>昔々 、</text></g><g class='c-blue'><rect x='420' y='150' width='240' height='62' rx='8'/><text class='th' x='540.0' y='170' text-anchor='middle'>名詞句（主語・が）</text><text class='t' x='540.0' y='189' text-anchor='middle'>漁師 が</text></g><g class='c-purple'><rect x='300' y='300' width='220' height='62' rx='8'/><text class='th' x='410.0' y='320' text-anchor='middle'>連体修飾（名前）</text><text class='t' x='410.0' y='339' text-anchor='middle'>浦島太郎 と いう</text></g><text class='ts' x='410' y='380' text-anchor='middle'>固有名詞 浦島 + 太郎 ／ 格助詞 と + 動詞 いう</text><g class='c-amber'><rect x='560' y='300' width='140' height='62' rx='8'/><text class='th' x='630.0' y='320' text-anchor='middle'>連体修飾</text><text class='t' x='630.0' y='339' text-anchor='middle'>優しい</text></g><text class='ts' x='630' y='380' text-anchor='middle'>形容詞</text><path class='arr' d='M140 150 L300 78' fill='none' marker-end='url(#a)'/><path class='arr' d='M540 150 L430 78' fill='none' marker-end='url(#a)'/><path class='arr' d='M410 300 L510 214' fill='none' marker-end='url(#a)'/><path class='arr' d='M630 300 L580 214' fill='none' marker-end='url(#a)'/><text class='ts' x='200' y='122' text-anchor='middle'>いつ</text><text class='ts' x='505' y='122' text-anchor='middle'>誰が（主語）</text><text class='ts' x='440'