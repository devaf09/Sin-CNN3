<svg viewBox='0 0 960 460' xmlns='http://www.w3.org/2000/svg'><style>
.c-coral rect{fill:#FCE3DA;stroke:#D85A30} .c-blue rect{fill:#DCEBFA;stroke:#3B7DD8} .c-amber rect{fill:#FBEFD5;stroke:#C98A12}
.c-purple rect{fill:#ECE3F7;stroke:#7E57C2} .c-teal rect{fill:#D8F1EE;stroke:#1F8F84} .c-gray rect{fill:#EEEEEE;stroke:#888}
.c-green rect{fill:#DFF3DF;stroke:#3C9A3C} rect{stroke-width:1.2}
.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}
.arr{stroke:#666;stroke-width:1.4} .ax{stroke:#999;stroke-width:1}
</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker></defs><rect width='960' height='460' fill='#fff'/><text class='th' x='400' y='22' text-anchor='middle'>構造と時の順を 1 枚の光に畳む（結びつけ = 掛け算、重ね合わせ = 足し算）</text><g class='c-blue'><rect x='20' y='40' width='170' height='80' rx='8'/><text class='th' x='105.0' y='60' text-anchor='middle'>結びつけ ⊙</text><text class='ts' x='105.0' y='78' text-anchor='middle'>役割の光 × 語の光</text><text class='ts' x='105.0' y='96' text-anchor='middle'>（位相の板を通す）</text><text class='ts' x='105.0' y='114' text-anchor='middle'>主語 ⊙ 太郎</text></g><g class='c-amber'><rect x='215' y='40' width='170' height='80' rx='8'/><text class='th' x='300.0' y='60' text-anchor='middle'>枠（出来事）＋</text><text class='ts' x='300.0' y='78' text-anchor='middle'>述語 ⊙ 見つける</text><text class='ts' x='300.0' y='96' text-anchor='middle'>+ 主語 ⊙ 太郎</text><text class='ts' x='300.0' y='114' text-anchor='middle'>+ 目的語 ⊙ 亀 + 袋</text></g><g class='c-coral'><rect x='410' y='40' width='170' height='80' rx='8'/><text class='th' x='495.0' y='60' text-anchor='middle'>時刻の鍵 τ^k</text><text class='ts' x='495.0' y='78' text-anchor='middle'>1 文ごとに位相を回す</text><text class='ts' x='495.0' y='96' text-anchor='middle'>文の中は σ^j</text><text class='ts' x='495.0' y='114' text-anchor='middle'>次 = 1 歩回すだけ</text></g><g class='c-purple'><rect x='605' y='40' width='175' height='80' rx='8'/><text class='th' x='692.5' y='60' text-anchor='middle'>物語の光（1 枚）</text><text class='ts' x='692.5' y='78' text-anchor='middle'>Σ τ^k σ^j ⊙ 枠</text><text class='ts' x='692.5' y='96' text-anchor='middle'>80 枠・255 語が</text><text class='ts' x='692.5' y='114' text-anchor='middle'>長さ D の光に重なる</text></g><path class='arr' d='M190 80 L213 80' fill='none' marker-end='url(#a)'/><path class='arr' d='M385 80 L408 80' fill='none' marker-end='url(#a)'/><path class='arr' d='M580 80 L603 80' fill='none' marker-end='url(#a)'/><g class='c-green'><rect x='20' y='150' width='370' height='62' rx='8'/><text class='th' x='205.0' y='170' text-anchor='middle'>取り出し（逆の位相を掛ける）</text><text class='ts' x='205.0' y='188' text-anchor='middle'>物語 ⊙ τ^-k σ^-j ⊙ 主語^-1 → 太郎 + ばらばらの雑音</text><text class='ts' x='205.0' y='206' text-anchor='middle'>→ 語の名札の一覧と重ねて、いちばん近い語（掃除）</text></g><g class='c-teal'><rect x='410' y='150' width='370' height='62' rx='8'/><text class='th' x='595.0' y='170' text-anchor='middle'>質問</text><text class='ts' x='595.0' y='188' text-anchor='middle'>手がかり（主語 ⊙ 太郎 + 述語 ⊙ 買い取る ×2 + 袋）</text><text class='ts' x='595.0' y='206' text-anchor='middle'>→ どの枠（時刻）と重なるか → 答えの役割で取り出す</text></g><path class='arr' d='M690 122 L600 148' fill='none' marker-end='url(#a)'/><path class='arr' d='M690 122 L210 148' fill='none' marker-end='url(#a)'/><text class='th' x='400' y='254' text-anchor='middle'>結果（浦島太郎、述語ごとの枠 80 個）</text><line class='ax' x1='70' y1='420' x2='560' y2='420'/><line class='ax' x1='70' y1='270' x2='70' y2='420'/><text class='ts' x='62' y='424' text-anchor='end'>0%</text><line x1='70' x2='560' y1='420' y2='420' stroke='#eee'/><text class='ts' x='62' y='349.0' text-anchor='end'>50%</text><line x1='70' x2='560' y1='345.0' y2='345.0' stroke='#eee'/><text class='ts' x='62' y='274' text-anchor='end'>100%</text><line x1='70' x2='560' y1='270' y2='270' stroke='#eee'/><rect x='90' y='408.8235294117647' width='26' height='11.176470588235293' fill='#3B7DD8' rx='2'/><text class='ts' x='103' y='404.8235294117647' text-anchor='middle'>7</text><rect x='120' y='412.10526315789474' width='26' height='7.894736842105263' fill='#1F8F84' rx='2'/><text class='ts' x='133' y='408.10526315789474' text-anchor='middle'>5</text><rect x='150' y='420.0' width='26' height='0.0' fill='#D85A30' rx='2'/><text class='ts' x='163' y='416.0' text-anchor='middle'>0</text><text class='ts' x='132' y='438' text-anchor='middle'>D = 256</text><rect x='208' y='383.52941176470586' width='26' height='36.470588235294116' fill='#3B7DD8' rx='2'/><text class='ts' x='221' y='379.52941176470586' text-anchor='middle'>24</text><rect x='238' y='325.2631578947369' width='26' height='94.73684210526315' fill='#1F8F84' rx='2'/><text class='ts' x='251' y='321.2631578947369' text-anchor='middle'>63</text><rect x='268' y='385.0' width='26' height='35.0' fill='#D85A30' rx='2'/><text class='ts' x='281' y='381.0' text-anchor='middle'>23</text><text class='ts' x='250' y='438' text-anchor='middle'>D = 1024</text><rect x='326' y='287.6470588235294' width='26' height='132.35294117647058' fill='#3B7DD8' rx='2'/><text class='ts' x='339' y='283.6470588235294' text-anchor='middle'>88</text><rect x='356' y='293.6842105263158' width='26' height='126.3157894736842' fill='#1F8F84' rx='2'/><text class='ts' x='369' y='289.6842105263158' text-anchor='middle'>84</text><rect x='386' y='360.0' width='26' height='60.0' fill='#D85A30' rx='2'/><text class='ts' x='399' y='356.0' text-anchor='middle'>40</text><text class='ts' x='368' y='438' text-anchor='middle'>D = 4096</text><rect x='444' y='273.52941176470586' width='26' height='146.47058823529412' fill='#3B7DD8' rx='2'/><text class='ts' x='457' y='269.52941176470586' text-anchor='middle'>98</text><rect x='474' y='270.0' width='26' height='150.0' fill='#1F8F84' rx='2'/><text class='ts' x='487' y='266.0' text-anchor='middle'>100</text><rect x='504' y='360.0' width='26' height='60.0' fill='#D85A30' rx='2'/><text class='ts' x='517' y='356.0' text-anchor='middle'>40</text><text class='ts' x='486' y='438' text-anchor='middle'>D = 16384</text><line x1='70' x2='560' y1='275.0' y2='275.0' stroke='#D85A30' stroke-dasharray='5 4'/><text class='ts' x='562' y='279.0' text-anchor='start'>文章樹 29/30</text><rect x='590' y='310' width='14' height='14' fill='#3B7DD8'/><text class='ts' x='610' y='322' text-anchor='start'>取り出し正答（時刻・役割が分かるとき）</text><rect x='590' y='334' width='14' height='14' fill='#1F8F84'/><text class='ts' x='610' y='346' text-anchor='start'>次の出来事（19 問）</text><rect x='590' y='358' width='14' height='14' fill='#D85A30'/><text class='ts' x='610' y='370' text-anchor='start'>質問 30 問</text><text class='ts' x='590' y='400' text-anchor='start'>覚えること・順番は D を大きくすれば正しく出る。</text><text class='ts' x='590' y='418' text-anchor='start'>外れるのは「質問がどの枠か」を選ぶところ。</text></svg>