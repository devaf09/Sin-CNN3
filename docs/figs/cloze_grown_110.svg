<svg viewBox='0 0 920 340' xmlns='http://www.w3.org/2000/svg'><style>.ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}</style><rect width='920' height='340' fill='#fff'/><text class='th' x='250' y='26' text-anchor='middle'>穴埋め MRR（試し 6796 問）</text><line x1='60' x2='440' y1='270.0' y2='270.0' stroke='#eee'/><text class='ts' x='54' y='274.0' text-anchor='end'>0.00</text><line x1='60' x2='440' y1='196.66666666666669' y2='196.66666666666669' stroke='#eee'/><text class='ts' x='54' y='200.66666666666669' text-anchor='end'>0.03</text><line x1='60' x2='440' y1='123.33333333333334' y2='123.33333333333334' stroke='#eee'/><text class='ts' x='54' y='127.33333333333334' text-anchor='end'>0.06</text><line x1='60' x2='440' y1='50.0' y2='50.0' stroke='#eee'/><text class='ts' x='54' y='54.0' text-anchor='end'>0.09</text><rect x='80' y='136.2888888888889' width='60' height='133.7111111111111' fill='#B8C7D9' rx='2'/><text class='ts' x='110' y='131.2888888888889' text-anchor='middle'>0.0547</text><text class='ts' x='110' y='286' text-anchor='middle'>学ぶ前</text><text class='ts' x='110' y='301' text-anchor='middle'>（袋）</text><rect x='172' y='115.8945667840022' width='60' height='154.1054332159978' fill='#B8C7D9' rx='2'/><text class='ts' x='202' y='110.8945667840022' text-anchor='middle'>0.0630</text><text class='ts' x='202' y='286' text-anchor='middle'>並びの</text><text class='ts' x='202' y='301' text-anchor='middle'>近さ</text><rect x='264' y='90.28692894862576' width='60' height='179.71307105137424' fill='#1F8F84' rx='2'/><text class='ts' x='294' y='85.28692894862576' text-anchor='middle'>0.0735</text><text class='ts' x='294' y='286' text-anchor='middle'>穴埋めで</text><text class='ts' x='294' y='301' text-anchor='middle'>学んだ重み</text><rect x='356' y='60.52333570579316' width='60' height='209.47666429420684' fill='#D85A30' rx='2'/><text class='ts' x='386' y='55.52333570579316' text-anchor='middle'>0.0857</text><text class='ts' x='386' y='286' text-anchor='middle'>GiNZA</text><text class='ts' x='386' y='301' text-anchor='middle'>の木</text><text class='ts' x='250' y='326' text-anchor='middle'>人の木を使わずに、並び → 人の木 の差の約 45% を埋めた</text><text class='th' x='690' y='26' text-anchor='middle'>逆回し: 混ぜた文節の並べ直し（3〜6 文節、300 文）</text><text class='ts' x='520' y='70' text-anchor='start'>丸ごと一致</text><rect x='520' y='78' width='48.0' height='18' fill='#1F8F84' rx='2'/><text class='ts' x='574.0' y='92' text-anchor='start'>学んだ重み 16%</text><rect x='520' y='102' width='16.749999999999936' height='18' fill='#B8C7D9' rx='2'/><text class='ts' x='542.7499999999999' y='116' text-anchor='start'>でたらめ 6%</text><text class='ts' x='520' y='160' text-anchor='start'>2 つずつの前後</text><rect x='520' y='168' width='178.85985748218528' height='18' fill='#1F8F84' rx='2'/><text class='ts' x='704.8598574821852' y='182' text-anchor='start'>学んだ重み 60%</text><rect x='520' y='192' width='150.0' height='18' fill='#B8C7D9' rx='2'/><text class='ts' x='676.0' y='206' text-anchor='start'>でたらめ 50%</text><text class='ts' x='690' y='260' text-anchor='middle'>同じ重みを逆に回すと、並びも少し当たる（まだ弱い）</text></svg>