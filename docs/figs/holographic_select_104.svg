<svg viewBox='0 0 940 400' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}
.arr{stroke:#666;stroke-width:1.4} .ax{stroke:#999;stroke-width:1}</style><rect width='940' height='400' fill='#fff'/><text class='th' x='190' y='24' text-anchor='middle'>まわり: 離れた枠ほど薄く足す（γ = 0.5）</text><line class='arr' x1='190' y1='98' x2='90' y2='142'/><line class='arr' x1='190' y1='98' x2='290' y2='142'/><line class='arr' x1='90' y1='178' x2='50' y2='222'/><line class='arr' x1='90' y1='178' x2='140' y2='222'/><line class='arr' x1='290' y1='178' x2='330' y2='222'/><rect x='148' y='62' width='84' height='36' rx='8' fill='#3B7DD8' fill-opacity='0.75' stroke='#3B7DD8'/><text class='ts' x='190' y='78' text-anchor='middle'>選んだ枠</text><text class='ts' x='190' y='93' text-anchor='middle'>× 1.0</text><rect x='48' y='142' width='84' height='36' rx='8' fill='#3B7DD8' fill-opacity='0.44999999999999996' stroke='#3B7DD8'/><text class='ts' x='90' y='158' text-anchor='middle'>距離 1</text><text class='ts' x='90' y='173' text-anchor='middle'>× 0.5</text><rect x='248' y='142' width='84' height='36' rx='8' fill='#3B7DD8' fill-opacity='0.44999999999999996' stroke='#3B7DD8'/><text class='ts' x='290' y='158' text-anchor='middle'>距離 1</text><text class='ts' x='290' y='173' text-anchor='middle'>× 0.5</text><rect x='8' y='222' width='84' height='36' rx='8' fill='#3B7DD8' fill-opacity='0.3' stroke='#3B7DD8'/><text class='ts' x='50' y='238' text-anchor='middle'>距離 2</text><text class='ts' x='50' y='253' text-anchor='middle'>× 0.25</text><rect x='98' y='222' width='84' height='36' rx='8' fill='#3B7DD8' fill-opacity='0.3' stroke='#3B7DD8'/><text class='ts' x='140' y='238' text-anchor='middle'>距離 2</text><text class='ts' x='140' y='253' text-anchor='middle'>× 0.25</text><rect x='288' y='222' width='84' height='36' rx='8' fill='#3B7DD8' fill-opacity='0.3' stroke='#3B7DD8'/><text class='ts' x='330' y='238' text-anchor='middle'>距離 2</text><text class='ts' x='330' y='253' text-anchor='middle'>× 0.25</text><text class='ts' x='190' y='290' text-anchor='middle'>枠の点 = 自分の重なり + 0.5 × 隣 + 0.25 × その隣 …</t