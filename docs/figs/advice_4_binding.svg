<svg viewBox='0 0 900 230' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}
.arr{stroke:#666;stroke-width:1.4;fill:none} .ax{stroke:#999;stroke-width:1}</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker><marker id='r' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#D85A30'/></marker></defs><rect width='900' height='230' fill='#fff'/><text class='th' x='450' y='24' text-anchor='middle'>提案 4: 名札 ⊗ 役割（同一性）と 属性の光（意味）を分けて持つ</text><rect x='30' y='50' width='250' height='70' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='155.0' y='69' text-anchor='middle'>名札 ⊗ 役割</text><text class='ts' x='155.0' y='86' text-anchor='middle'>太郎 ⊙ 主語（位相の掛け算）</text><text class='ts' x='155.0' y='103' text-anchor='middle'>誰が・何を を誤りなく照合</text><text class='th' x='315' y='92' text-anchor='middle'>+</text><rect x='350' y='50' width='250' height='70' rx='8' fill='#D8F1EE' stroke='#1F8F84'/><text class='th' x='475.0' y='69' text-anchor='middle'>属性の光</text><text class='ts' x='475.0' y='86' text-anchor='middle'>語板の光（人・男・漁師らしさ）</text><text class='ts' x='475.0' y='103' text-anchor='middle'>言い換え・どんな人か に使う</text><text class='th' x='635' y='92' text-anchor='middle'>=</text><rect x='670' y='50' width='200' height='70' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='770.0' y='69' text-anchor='middle'>節の表現</text><text class='ts' x='770.0' y='86' text-anchor='middle'>照合は名札で</text><text class='ts' x='770.0' y='103' text-anchor='middle'>連想は属性で</text><rect x='30' y='150' width='840' height='60' rx='8' fill='#EEEEEE' stroke='#888'/><text class='th' x='450.0' y='169' text-anchor='middle'>今の状況: 実験103 で名札 ⊙ 役割 は済み（取り出し 98%、誤爆は問題でなかった）</text><text class='ts' x='450.0' y='186' text-anchor='middle'>外れたのは「質問がどの枠か」を選ぶ所。属性の光を別の層で足すのは未試験 → 枠の選び方に使えるかもしれない</text></svg>