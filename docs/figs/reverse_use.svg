<svg viewBox='0 0 900 320' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222} .arr{stroke-width:1.8;fill:none}</style><defs><marker id='b' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#3B7DD8'/></marker><marker id='o' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#D85A30'/></marker></defs><rect width='900' height='320' fill='#fff'/><text class='th' x='450' y='24' text-anchor='middle'>文法の逆回し: 同じ重み（共鳴 × 手がかりの重み θ）を、両方の向きに使う</text><rect x='40' y='60' width='220' height='70' rx='8' fill='#EEEEEE' stroke='#888'/><text class='th' x='150.0' y='79' text-anchor='middle'>文（並んだ語）</text><text class='ts' x='150.0' y='96' text-anchor='middle'>太郎は 浜辺で 亀を 見つけます</text><rect x='640' y='60' width='220' height='70' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='750.0' y='79' text-anchor='middle'>構造（重み・骨格）</text><text class='ts' x='750.0' y='96' text-anchor='middle'>誰が・どこで・何を・見つける</text><text class='ts' x='750.0' y='113' text-anchor='middle'>どの手がかりを重く見るか</text><rect x='340' y='50' width='220' height='90' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='th' x='450.0' y='69' text-anchor='middle'>同じ重み</text><text class='ts' x='450.0' y='86' text-anchor='middle'>語どうしの共鳴（PMI）</text><text class='ts' x='450.0' y='103' text-anchor='middle'>× 手がかりの重み θ</text><text class='ts' x='450.0' y='120' text-anchor='middle'>（穴埋めで学ぶ）</text><path class='arr' d='M260 80 L338 80' stroke='#3B7DD8' marker-end='url(#b)'/><path class='arr' d='M560 80 L638 80' stroke='#3B7DD8' marker-end='url(#b)'/><text class='ts' x='450' y='40' text-anchor='middle'>解析の向き（読む）: 文 → 構造</text><path class='arr' d='M638 115 L560 115' stroke='#D85A30' marker-end='url(#o)'/><path class='arr' d='M338 115 L262 115' stroke='#D85A30' marker-end='url(#o)'/><text class='ts' x='450' y='160' text-anchor='middle'>生成の向き（書く）: 構造 → 文（穴埋め・並べ直し・骨格の展開）</text><rect x='40' y='190' width='820' height='110' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='th' x='450.0' y='209' text-anchor='middle'>使い道</text><text class='ts' x='450.0' y='226' text-anchor='middle'>1. 穴埋め = 1 語の生成（実験109・110）  2. 並べ直し = 語の順番の生成（実験110 の逆回し）  3. 骨格 → 文節の展開（実験105）</text><text class='ts' x='450.0' y='243' text-anchor='middle'>4. 質問に答える = 物語の光の中の穴埋め（実験103）  5. 逆引き: 属性 → 語（語板の逆引き、実験76）</text><text class='ts' x='450.0' y='260' text-anchor='middle'>6. 往復で自分を確かめる: 文 → 構造 → 文 と回して、元の文に戻るほど良い構造（笛のように吹いて返す）</text><text class='ts' x='450.0' y='277' text-anchor='middle'>   答えが元の文そのものなので、自分の癖を強め合う輪（実験107・108）になりにくい</text></svg>