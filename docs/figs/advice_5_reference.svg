<svg viewBox='0 0 900 300' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}
.arr{stroke:#666;stroke-width:1.4;fill:none} .ax{stroke:#999;stroke-width:1}</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker><marker id='r' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#D85A30'/></marker></defs><rect width='900' height='300' fill='#fff'/><text class='th' x='450' y='24' text-anchor='middle'>提案 5: 大域の参照光（今何を目指すかを、全部の節に配る）</text><rect x='350' y='45' width='200' height='50' rx='8' fill='#ECE3F7' stroke='#7E57C2'/><text class='th' x='450.0' y='64' text-anchor='middle'>意図の光</text><text class='ts' x='450.0' y='81' text-anchor='middle'>述語・問いの中心</text><rect x='60' y='160' width='150' height='40' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='t' x='135.0' y='179' text-anchor='middle'>太郎は</text><path class='arr' d='M450 97 L135 158' stroke='#7E57C2' stroke-dasharray='5 4' marker-end='url(#a)'/><rect x='260' y='160' width='150' height='40' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='t' x='335.0' y='179' text-anchor='middle'>浜辺で</text><path class='arr' d='M450 97 L335 158' stroke='#7E57C2' stroke-dasharray='5 4' marker-end='url(#a)'/><rect x='460' y='160' width='150' height='40' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='t' x='535.0' y='179' text-anchor='middle'>亀を</text><path class='arr' d='M450 97 L535 158' stroke='#7E57C2' stroke-dasharray='5 4' marker-end='url(#a)'/><rect x='660' y='160' width='150' height='40' rx='8' fill='#DCEBFA' stroke='#3B7DD8'/><text class='t' x='735.0' y='179' text-anchor='middle'>見つけます。</text><path class='arr' d='M450 97 L735 158' stroke='#7E57C2' stroke-dasharray='5 4' marker-end='url(#a)'/><rect x='60' y='225' width='780' height='60' rx='8' fill='#EEEEEE' stroke='#888'/><text class='th' x='450.0' y='244' text-anchor='middle'>これまでの結果: 効くのは「何を目指すか」の情報そのもの</text><text class='ts' x='450.0' y='261' text-anchor='middle'>実験97: 質問の述語を 2 倍 → 29/30（効いた） ／ 実験105: 係る先の述語を全スロットに配る → +2〜3 点だけ</text></svg>