<svg viewBox='0 0 900 230' xmlns='http://www.w3.org/2000/svg'><style>.t{font:14px sans-serif;fill:#222} .ts{font:12px sans-serif;fill:#555} .th{font:bold 14px sans-serif;fill:#222}
.arr{stroke:#666;stroke-width:1.4;fill:none} .ax{stroke:#999;stroke-width:1}</style><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker><marker id='r' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#D85A30'/></marker></defs><rect width='900' height='230' fill='#fff'/><text class='th' x='450' y='24' text-anchor='middle'>提案 2: 命題 → 骨格（格フレーム）→ 並列の文節展開</text><rect x='20' y='50' width='230' height='110' rx='8' fill='#ECE3F7' stroke='#7E57C2'/><text class='th' x='135.0' y='69' text-anchor='middle'>1. 命題を選ぶ</text><text class='ts' x='135.0' y='86' text-anchor='middle'>バッファから述語を 1 つ</text><text class='ts' x='135.0' y='103' text-anchor='middle'>例: 見つける</text><text class='ts' x='135.0' y='120' text-anchor='middle'>（何を言いたいか）</text><text class='ts' x='135.0' y='137' text-anchor='middle'>まだ無い</text><rect x='330' y='50' width='250' height='110' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='455.0' y='69' text-anchor='middle'>2. 骨格を作る</text><text class='ts' x='455.0' y='86' text-anchor='middle'>述語の要求する格のスロット</text><text class='ts' x='455.0' y='103' text-anchor='middle'>[が] [で] [を] + 見つける</text><text class='ts' x='455.0' y='120' text-anchor='middle'>+ つなぎ方・文の結び（実験105）</text><text class='ts' x='455.0' y='137' text-anchor='middle'>→ 実験106 で試す</text><rect x='660' y='50' width='220' height='110' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='th' x='770.0' y='69' text-anchor='middle'>3. 並列に展開</text><text class='ts' x='770.0' y='86' text-anchor='middle'>スロットごとに局所で</text><text class='ts' x='770.0' y='103' text-anchor='middle'>太郎は / 浜辺で / 亀を</text><text class='ts' x='770.0' y='120' text-anchor='middle'>/ 見つけます。</text><text class='ts' x='770.0' y='137' text-anchor='middle'>実験105: 60〜80%</text><path class='arr' d='M250 105 L328 105' marker-end='url(#a)'/><path class='arr' d='M580 105 L658 105' marker-end='url(#a)'/><text class='ts' x='455' y='190' text-anchor='middle'>スロットの中身を埋める名詞は、語板 v5 の V:が・V:を…（その格に来やすい名詞の仲間）から選べる</text><text class='ts' x='455' y='210' text-anchor='middle'>注意: は／が、つなぎ方、文の結び（丁寧さ・人称）は述語からは決まらない → 話の流れと話者関係から</text></svg>