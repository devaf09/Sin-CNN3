<svg viewBox='0 0 960 385' xmlns='http://www.w3.org/2000/svg'><style>.t{font:13px sans-serif;fill:#222} .ts{font:11px sans-serif;fill:#555} .th{font:bold 13px sans-serif;fill:#222} .arr{stroke:#666;stroke-width:1.4;fill:none}</style><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#666'/></marker></defs><rect width='960' height='385' fill='#fff'/><text class='th' x='480' y='22' text-anchor='middle'>テストボット02 の部品（Sin-CNN3 → 言結いへ引き継ぐもの）</text><rect x='20' y='40' width='170' height='50' rx='8' fill='#EEEEEE' stroke='#888'/><text class='th' x='105.0' y='57' text-anchor='middle'>相手の発言</text><text class='ts' x='105.0' y='72' text-anchor='middle'>+ 前の会話</text><rect x='230' y='36' width='200' height='58' rx='8' fill='#ECE3F7' stroke='#7E57C2'/><text class='th' x='330.0' y='53' text-anchor='middle'>読む</text><text class='ts' x='330.0' y='68' text-anchor='middle'>状態遷移グレイン（16 状態、実験120）</text><text class='ts' x='330.0' y='83' text-anchor='middle'>話題の切り替わり（実験121）</text><rect x='230' y='104' width='200' height='58' rx='8' fill='#ECE3F7' stroke='#7E57C2'/><text class='th' x='330.0' y='121' text-anchor='middle'>読む</text><text class='ts' x='330.0' y='136' text-anchor='middle'>格逆算グレイン（実験119）</text><text class='ts' x='330.0' y='151' text-anchor='middle'>課題の読み取り・知らない語</text><rect x='470' y='36' width='220' height='126' rx='8' fill='#D8F1EE' stroke='#1F8F84'/><text class='th' x='580.0' y='53' text-anchor='middle'>選ぶ（返事の候補）</text><text class='ts' x='580.0' y='68' text-anchor='middle'>雑談 33 万発言から（実験115）</text><text class='ts' x='580.0' y='83' text-anchor='middle'>重なり・次の発言の共鳴・口調</text><text class='ts' x='580.0' y='98' text-anchor='middle'>遷移・前の話題・キャラ・時計</text><text class='ts' x='580.0' y='113' text-anchor='middle'>体験談を下げる</text><text class='ts' x='580.0' y='128' text-anchor='middle'>揺らした 10 通りの票 = 自信</text><rect x='730' y='36' width='210' height='126' rx='8' fill='#DFF3DF' stroke='#3C9A3C'/><text class='th' x='835.0' y='53' text-anchor='middle'>組み立てる</text><text class='ts' x='835.0' y='68' text-anchor='middle'>共感（何に + 〜んですね）</text><text class='ts' x='835.0' y='83' text-anchor='middle'>→ 内容 → 質問（遷移で決める）</text><text class='ts' x='835.0' y='98' text-anchor='middle'>結びは基本丁寧（実験117）</text><text class='ts' x='835.0' y='113' text-anchor='middle'>自信がない → どんな〜ですか？</text><text class='ts' x='835.0' y='128' text-anchor='middle'>知らない語 → 聞き返す</text><rect x='230' y='190' width='200' height='70' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='330.0' y='207' text-anchor='middle'>キャラ</text><text class='ts' x='330.0' y='222' text-anchor='middle'>プロフィール（持ち主が書く）</text><text class='ts' x='330.0' y='237' text-anchor='middle'>人格グレイン（選び方の重み）</text><rect x='470' y='190' width='220' height='70' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='580.0' y='207' text-anchor='middle'>対話者グレイン</text><text class='ts' x='580.0' y='222' text-anchor='middle'>名前・好き・予定・困りごと</text><text class='ts' x='580.0' y='237' text-anchor='middle'>（保存は非公開の置き場だけ）</text><rect x='730' y='190' width='210' height='70' rx='8' fill='#FBEFD5' stroke='#C98A12'/><text class='th' x='835.0' y='207' text-anchor='middle'>時計グレイン</text><text class='ts' x='835.0' y='222' text-anchor='middle'>時間帯・月・季節（10 分刻み）</text><text class='ts' x='835.0' y='237' text-anchor='middle'>表は持ち主が直せる</text><path class='arr' d='M190 65 L228 65' marker-end='url(#a)'/><path class='arr' d='M190 70 L228 130' marker-end='url(#a)'/><path class='arr' d='M430 65 L468 80' marker-end='url(#a)'/><path class='arr' d='M430 133 L468 120' marker-end='url(#a)'/><path class='arr' d='M690 99 L728 99' marker-end='url(#a)'/><path class='arr' d='M330 190 L520 164' marker-end='url(#a)'/><path class='arr' d='M580 190 L580 164' marker-end='url(#a)'/><path class='arr' d='M835 190 L640 164' marker-end='url(#a)'/><rect x='20' y='290' width='920' height='78' rx='8' fill='#FCE3DA' stroke='#D85A30'/><text class='th' x='480.0' y='307' text-anchor='middle'>引き継ぐときに直すこと</text><text class='ts' x='480.0' y='322' text-anchor='middle'>結びの付け替えの表は、実験だけに使う材料（Web 小説を含む）から作っている → ライセンスの分かる材料で作り直す</text><text class='ts' x='480.0' y='337' text-anchor='middle'>返事の候補・遷移グレイン・格の好みは RealPersonaChat・JMultiWOZ（CC BY-SA 4.0）から → 表示と同じ条件で</text><text class='ts' x='480.0' y='352' text-anchor='middle'>選ぶ部分は数え上げ（光の器ではない）→ 言結いのグレイン（光の部品）に置き換えていく</text></svg>